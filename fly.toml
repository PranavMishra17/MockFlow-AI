# MockFlow-AI — Fly.io app config.
#
# NOTE: `fly launch` regenerates this file and strips comments. It kept every
# functional setting last time, but re-check the values below after running it.
#
# Full walkthrough + why Cloudflare Workers cannot host this: docs/DEPLOYMENT.md

app = 'mockflow-ai'

# Must match the Neon project's region — every request does at least one Postgres
# round-trip. Verified: Neon is us-east-1, which is what `iad` maps to.
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  # FLASK_ENV=production makes app.py fail fast on a missing secret, so a boot
  # crash loop here (gunicorn exit_code=3, "worker failed to boot") means a
  # secret is unset — check `fly secrets list` before anything else.
  FLASK_ENV = 'production'
  # MEMORY cap, not a traffic cap: each interview spawns an agent_worker.py
  # subprocess that loads Silero VAD (ONNX). Measured idle footprint of the web
  # process is ~260 MB of the 2 GB below.
  MAX_CONCURRENT_WORKERS = '3'
  # gunicorn binds 8080 in the Dockerfile CMD; keep these in agreement.
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # ALWAYS-ON. This is what stops the Render-style spin-down — and it is also
  # what makes the machine bill 24/7. See docs/DEPLOYMENT.md "Staying always-on"
  # for the cost trade and why scale-to-zero is NOT safe for this app: the
  # browser makes zero HTTP calls to this app during an interview (audio goes
  # through LiveKit Cloud), so an auto-stop would kill the agent mid-interview.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  # Do NOT raise max_machines_running: worker_manager keeps active interviews in
  # an in-process dict, so a second machine cannot see the first's workers.
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  # Measured: ~263 MB in use at idle out of 2048 MB. Sized for headroom on
  # concurrent interviews (onnxruntime per worker), not for the web process.
  # shared-cpu-2x is deliberate: on a low-CPU instance Silero VAD runs "inference
  # slower than realtime" and the voice breaks up.
  size = 'shared-cpu-2x'
  memory = '2gb'
