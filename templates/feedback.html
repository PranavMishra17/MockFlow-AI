<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Feedback &mdash; MockFlow-AI</title>
    <meta name="description" content="Your hiring verdict from MockFlow-AI: where you'd land in a real loop today, the evidence behind the call, and your single highest-leverage next rep.">
    <meta property="og:title" content="Interview Feedback &mdash; MockFlow-AI">
    <meta property="og:description" content="Your hiring verdict: where you'd land today, the evidence behind the call, and your next rep.">
    <meta property="og:type" content="article">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/radar.css">
    <link rel="stylesheet" href="/static/feedback.css">
    <link rel="stylesheet" href="/static/modals.css">
</head>
<body>
    <!-- Action Buttons (Right Side) - populated by header.js -->
    <div class="action-buttons" id="actionButtons"></div>

    <div class="feedback-page">
        <!-- Page Header -->
        <div class="page-header">
            <h1>Interview Feedback</h1>
        </div>

        <!-- Interview Info Bar -->
        <div class="interview-info" id="interviewInfo" style="display: none;"></div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">Loading interview...</div>

        <!-- Error State -->
        <div class="error-state" id="errorState" style="display: none;"></div>

        <!-- Single-column progressive reveal (Wing D) -->
        <div class="reveal-stage" id="revealStage" style="display: none;">

            <!-- Generate (shown only when no verdict yet) -->
            <div class="generate-section" id="generateSection" style="display: none;">
                <button class="btn-generate-main" id="generateBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                    <span>Reveal your verdict</span>
                </button>
                <p class="generate-hint">See where you'd land in a real hiring loop today &mdash; the call, the evidence behind it, and your next rep.</p>
            </div>

            <!-- 4-phase loader, centered where the verdict will land -->
            <div class="reveal-loading" id="feedbackLoading" style="display: none;">
                <div class="loading-spinner-big"></div>
                <p class="loading-phase" id="loadingPhase">Reading your transcript...</p>
                <div class="phase-indicators">
                    <span class="phase-dot active" data-phase="1"></span>
                    <span class="phase-dot" data-phase="2"></span>
                    <span class="phase-dot" data-phase="3"></span>
                    <span class="phase-dot" data-phase="4"></span>
                </div>
            </div>

            <!-- The four moments (populated by JS) -->
            <div class="reveal-moments" id="revealMoments" style="display: none;">
                <span class="cached-indicator" id="cachedIndicator" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Saved report
                </span>
                <div id="heroSlot"></div>        <!-- Moment 1: the verdict -->
                <div id="nextRepSlot"></div>     <!-- Moment 3: your next rep -->
                <div id="signalsSlot"></div>     <!-- Moment 2: signals, your own words -->
                <div id="trajectorySlot"></div>  <!-- Moment 4: trajectory + delivery + coding -->
            </div>

            <!-- Footer actions -->
            <div class="report-footer" id="reportFooter" style="display: none;">
                <button class="btn-view-transcript" id="viewTranscriptBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <line x1="10" y1="9" x2="8" y2="9"/>
                    </svg>
                    <span>View full transcript</span>
                    <span class="turn-count" id="turnCount"></span>
                </button>
                <div class="report-actions" id="reportActions">
                    <button type="button" class="btn-report-action" id="downloadPdfBtn"
                            aria-label="Download this feedback report as a PDF using the browser print dialog">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M6 9V2h12v7"/>
                            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                            <rect x="6" y="14" width="12" height="8"/>
                        </svg>
                        <span>Download PDF</span>
                    </button>
                    <button type="button" class="btn-report-action" id="copyMarkdownBtn"
                            aria-label="Copy this feedback report to the clipboard as Markdown">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        <span class="btn-action-label" id="copyMarkdownLabel">Copy as Markdown</span>
                    </button>
                    <span class="copy-confirm" id="copyConfirm" role="status" aria-live="polite"></span>
                </div>
            </div>
        </div>

        <!-- Transcript Modal -->
        <div class="transcript-modal" id="transcriptModal">
            <div class="modal-backdrop" id="transcriptModalBackdrop"></div>
            <div class="transcript-modal-content">
                <div class="transcript-modal-header">
                    <h2>Interview Transcript</h2>
                    <button class="modal-close-btn" id="closeTranscriptBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="transcript-modal-body" id="transcriptModalBody"></div>
            </div>
        </div>
    </div>

    <script src="/static/utils.js"></script>
    <script src="/static/header.js"></script>
    <script src="/static/modal.js"></script>
    <script src="/static/radar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.MockFlowHeader.init({
                showHome: true,
                showBack: true,
                showInfo: true,
                showGithub: true,
                showSponsor: true,
                showSettings: true,
                showAuth: false
            });
        });
    </script>

    <script>
    (function() {
        'use strict';

        var filename = '{{ filename }}';
        var feedbackState = {
            verdict: null,
            conversationData: null,
            codingSubmissions: null,
            meta: null,
            reportGenerated: false
        };

        var elements = {
            loadingState: document.getElementById('loadingState'),
            errorState: document.getElementById('errorState'),
            interviewInfo: document.getElementById('interviewInfo'),

            revealStage: document.getElementById('revealStage'),
            generateSection: document.getElementById('generateSection'),
            generateBtn: document.getElementById('generateBtn'),
            feedbackLoading: document.getElementById('feedbackLoading'),
            loadingPhase: document.getElementById('loadingPhase'),
            revealMoments: document.getElementById('revealMoments'),
            cachedIndicator: document.getElementById('cachedIndicator'),
            heroSlot: document.getElementById('heroSlot'),
            nextRepSlot: document.getElementById('nextRepSlot'),
            signalsSlot: document.getElementById('signalsSlot'),
            trajectorySlot: document.getElementById('trajectorySlot'),

            reportFooter: document.getElementById('reportFooter'),
            viewTranscriptBtn: document.getElementById('viewTranscriptBtn'),
            turnCount: document.getElementById('turnCount'),
            downloadPdfBtn: document.getElementById('downloadPdfBtn'),
            copyMarkdownBtn: document.getElementById('copyMarkdownBtn'),
            copyConfirm: document.getElementById('copyConfirm'),

            transcriptModal: document.getElementById('transcriptModal'),
            transcriptModalBackdrop: document.getElementById('transcriptModalBackdrop'),
            transcriptModalBody: document.getElementById('transcriptModalBody'),
            closeTranscriptBtn: document.getElementById('closeTranscriptBtn')
        };

        document.addEventListener('DOMContentLoaded', init);

        function init() {
            loadInterview();
            elements.generateBtn.addEventListener('click', startFeedbackGeneration);
            elements.viewTranscriptBtn.addEventListener('click', openTranscriptModal);
            elements.closeTranscriptBtn.addEventListener('click', closeTranscriptModal);
            elements.transcriptModalBackdrop.addEventListener('click', closeTranscriptModal);
            elements.downloadPdfBtn.addEventListener('click', function() { window.print(); });
            elements.copyMarkdownBtn.addEventListener('click', copyFeedbackAsMarkdown);
        }

        function loadInterview() {
            fetch('/api/interview/' + encodeURIComponent(filename))
                .then(function(response) {
                    if (!response.ok) throw new Error('Interview not found');
                    return response.json();
                })
                .then(function(data) {
                    elements.loadingState.style.display = 'none';
                    if (data.error) {
                        showError('Interview not found in database: ' + data.error);
                        return;
                    }
                    renderInterview(data);
                    checkCachedFeedback();
                })
                .catch(function(err) {
                    console.error('[FEEDBACK] Load error:', err);
                    elements.loadingState.style.display = 'none';
                    showError('Failed to load interview. Please check your Past Interviews page.');
                });
        }

        function showError(message) {
            elements.loadingState.style.display = 'none';
            elements.errorState.innerHTML =
                '<p style="margin-bottom: 1rem;">' + message + '</p>' +
                '<div style="display: flex; gap: 0.75rem; justify-content: center;">' +
                    '<button onclick="location.reload()" class="btn-retry">Retry</button>' +
                    '<a href="/past-calls" class="btn-retry" style="text-decoration: none;">All Interviews</a>' +
                '</div>';
            elements.errorState.style.display = 'flex';
        }

        function renderInterview(data) {
            elements.revealStage.style.display = 'block';
            elements.interviewInfo.style.display = 'flex';
            elements.feedbackLoading.style.display = 'flex';  // show the loader immediately; auto-reveal kicks in once we know cache state

            var meta = data.meta || {};
            var conversation = data.ordered_conversation || [];
            feedbackState.conversationData = conversation;
            feedbackState.meta = meta;

            var stagesHtml = '';
            if (meta.stages_covered && meta.stages_covered.length) {
                stagesHtml = '<div class="info-item"><span class="info-label">Stages</span><div class="stages-list">' +
                    meta.stages_covered.filter(function(s) { return s; }).map(function(s) {
                        return '<span class="stage-badge">' + formatStage(s) + '</span>';
                    }).join('') + '</div></div>';
            }

            elements.interviewInfo.innerHTML =
                '<div class="info-item"><span class="info-label">Candidate</span><span class="info-value">' + escapeHtml(meta.candidate || 'Unknown') + '</span></div>' +
                '<div class="info-item"><span class="info-label">Date</span><span class="info-value">' + formatDate(meta.interview_date) + '</span></div>' +
                '<div class="info-item"><span class="info-label">Turns</span><span class="info-value">' + conversation.length + '</span></div>' +
                stagesHtml;

            elements.turnCount.textContent = conversation.length + ' turns';

            var transcriptHtml = conversation.map(function(turn) {
                var roleClass = turn.role === 'agent' ? 'agent' : 'candidate';
                var roleLabel = turn.role === 'agent' ? 'Interviewer' : 'Candidate';
                var stageTag = turn.stage ? '<span class="turn-stage">' + formatStage(turn.stage) + '</span>' : '';
                return '<div class="transcript-turn">' +
                    '<div class="turn-header">' +
                        '<span class="turn-role ' + roleClass + '">' + roleLabel + '</span>' + stageTag +
                    '</div>' +
                    '<p class="turn-text">' + escapeHtml(turn.text) + '</p>' +
                '</div>';
            }).join('');

            elements.transcriptModalBody.innerHTML = transcriptHtml || '<p style="color: var(--text-muted); text-align: center;">No transcript available.</p>';

            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('request_feedback') === '1' && !feedbackState.reportGenerated) {
                startFeedbackGeneration();
            }
        }

        function checkCachedFeedback() {
            fetch('/api/feedback/get/' + encodeURIComponent(filename))
                .then(function(response) { return response.ok ? response.json() : null; })
                .then(function(data) {
                    if (data && data.feedback_data && data.feedback_data.verdict) {
                        console.log('[FEEDBACK] Found cached verdict in database');
                        feedbackState.reportGenerated = true;
                        renderReveal(data.feedback_data.verdict, true);
                    } else {
                        console.log('[FEEDBACK] No cached verdict — auto-revealing');
                        startFeedbackGeneration();
                    }
                })
                .catch(function() { startFeedbackGeneration(); });
        }

        function startFeedbackGeneration() {
            if (feedbackState.reportGenerated) return;
            elements.generateBtn.disabled = true;
            generateVerdict();
        }

        // Wing D: a single call to the hiring-lens evaluator. The verdict IS the feedback.
        function generateVerdict() {
            console.log('[FEEDBACK] Generating hiring verdict...');
            elements.generateSection.style.display = 'none';
            elements.feedbackLoading.style.display = 'flex';

            var phases = ['Replaying your interview…', 'Weighing each answer against the bar…',
                          'Pulling the evidence from your own words…', 'Writing the hiring call…'];
            var pi = 0;
            var phaseInterval = setInterval(function() {
                pi = (pi + 1) % phases.length;
                elements.loadingPhase.textContent = phases[pi];
                document.querySelectorAll('.phase-dot').forEach(function(dot, i) {
                    dot.classList.toggle('active', i <= pi);
                });
            }, 2500);

            fetch('/api/feedback/verdict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ interview_id: filename })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                clearInterval(phaseInterval);
                if (data.error) { showRevealError(data.message || data.error); return; }
                console.log('[FEEDBACK] Verdict generated');
                feedbackState.reportGenerated = true;
                feedbackState.codingSubmissions = data.coding_submissions || null;
                renderReveal(data.verdict, false);
                saveFeedbackToDatabase(filename, { verdict: data.verdict });
            })
            .catch(function(err) {
                clearInterval(phaseInterval);
                console.error('[FEEDBACK] Verdict error:', err);
                showRevealError('Failed to evaluate interview: ' + err.message);
            });
        }

        function saveFeedbackToDatabase(interviewId, feedbackData) {
            fetch('/api/feedback/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ interview_id: interviewId, feedback: feedbackData })
            })
            .then(function(response) { return response.json(); })
            .then(function(result) {
                if (result.success) console.log('[FEEDBACK] Saved to database successfully');
                else console.error('[FEEDBACK] Save failed:', result.message);
            })
            .catch(function(err) { console.error('[FEEDBACK] Save error:', err); });
        }

        // ── Wing D labels ──
        var RECO_LABEL = {strong_no_hire:'Strong No-Hire', no_hire:'No-Hire', lean_no_hire:'Leaning No-Hire',
                          on_fence:'On the Fence', lean_hire:'Leaning Hire', hire:'Hire', strong_hire:'Strong Hire'};
        var RECO_TONE = {strong_no_hire:'neg', no_hire:'neg', lean_no_hire:'neg',
                         on_fence:'mid', lean_hire:'pos', hire:'pos', strong_hire:'pos'};
        var LEVEL_LABEL = {below_intern:'developing', intern:'intern', new_grad:'new-grad',
                           mid:'mid-level', above_mid:'above mid-level'};
        var BAND_LABEL = {outstanding:'Outstanding', solid:'Solid', borderline:'Borderline',
                          poor:'Poor', cannot_determine:'Not shown'};
        var ARCH_LABEL = {big_tech:'Big Tech', high_bar_startup:'high-bar startup'};
        var ROLE_LABEL = {swe:'software engineer', pm:'product manager', ds_mle:'data / ML'};
        var RECO_ORDER = ['strong_no_hire','no_hire','lean_no_hire','on_fence','lean_hire','hire','strong_hire'];
        var BAND_INFO = {
            outstanding: 'Top-tier — a clear strength that sets you apart from other candidates at this level.',
            solid: 'Meets the bar for this level — a reliable, positive hire signal.',
            borderline: 'On the fence — present but not yet convincing. This is where offers are won or lost.',
            poor: 'Below the bar — a likely no-hire driver on this signal.',
            cannot_determine: 'There wasn’t enough in the transcript to judge this fairly.'
        };
        var DELIVERY_TIPS = {
            wpm: {
                slow: 'A touch slow — add energy and momentum so you sound engaged.',
                ideal: 'Great pace — clear and easy to follow.',
                brisk: 'A little fast — brief pauses will help the listener keep up.',
                fast: 'Too fast — slow down and breathe; comprehension drops above ~190 wpm.',
                unknown: ''
            },
            filler: {
                good: 'Clean delivery — filler words are well controlled.',
                moderate: 'Some filler words — a deliberate pause beats an "um".',
                high: 'Frequent fillers hurt perceived clarity — pause instead of filling silence.'
            }
        };

        function nextRecoLabel(reco) {
            var i = RECO_ORDER.indexOf(reco);
            if (i < 0 || i >= RECO_ORDER.length - 1) return null;
            return RECO_LABEL[RECO_ORDER[i + 1]];
        }

        // ── The reveal: the verdict LANDS, then the breakdown writes in ──
        function renderReveal(v, fromCache) {
            feedbackState.verdict = v;
            elements.feedbackLoading.style.display = 'none';
            elements.generateSection.style.display = 'none';
            if (fromCache) elements.cachedIndicator.style.display = 'inline-flex';

            elements.heroSlot.innerHTML = renderHero(v);
            elements.nextRepSlot.innerHTML = renderNextRep(v);
            elements.signalsSlot.innerHTML = renderSignals(v);
            elements.trajectorySlot.innerHTML = renderTrajectory(v);

            elements.revealMoments.style.display = 'block';
            elements.reportFooter.style.display = 'flex';
            animateHero(v, fromCache);
            renderSessionRadar(v);
            setupProgressiveReveal();
            loadVsLast();
        }

        // Moment 1 — the verdict. No left-edge stripe; the spectrum is the read.
        function renderHero(v) {
            var o = v.overall || {}, ctx = v.context || {}, tone = RECO_TONE[o.recommendation] || 'mid';
            var aim = ctx.seniority ? (LEVEL_LABEL[ctx.seniority] || ctx.seniority) : null;
            var html = '<div class="verdict-hero verdict-' + tone + '">';
            html += '<div class="verdict-eyebrow">Where you’d land today';
            if (ctx.archetype && ctx.role) html += ' · ' + escapeHtml((ARCH_LABEL[ctx.archetype] || ctx.archetype) + ' ' + (ROLE_LABEL[ctx.role] || ctx.role));
            if (aim) html += ' · ' + escapeHtml(aim) + ' bar';
            html += '</div>';
            html += '<div class="vh-top"><div class="vh-reco">' + escapeHtml(RECO_LABEL[o.recommendation] || 'On the Fence') + '</div>';
            if (o.confidence) html += '<span class="vh-confidence vh-stagger">' + escapeHtml(o.confidence) + ' confidence</span>';
            html += '</div>';
            html += renderSpectrum(o.recommendation);
            var lvl = LEVEL_LABEL[o.level_read];
            if (lvl) html += '<div class="vh-level vh-stagger">performing at <strong>' + lvl + '</strong> level</div>';
            if (o.headline) html += '<p class="vh-headline vh-stagger">' + escapeHtml(o.headline) + '</p>';
            if (v.gap_to_next && v.gap_to_next.signal) {
                var g = v.gap_to_next, to = nextRecoLabel(o.recommendation);
                html += '<div class="vh-gap vh-stagger">' +
                    (to ? '<strong>One band from ' + escapeHtml(to) + ':</strong> ' : '<strong>To raise your verdict:</strong> ') +
                    escapeHtml(g.signal) + ' — ' + escapeHtml(g.move || '') + '</div>';
            }
            html += '<button type="button" class="vh-fullreport vh-stagger" id="fullReportBtn">See the full breakdown ↓</button>';
            html += '</div>';
            return html;
        }

        // The 7-point scale; the caret flutters then lands (animateHero).
        function renderSpectrum(reco) {
            var idx = RECO_ORDER.indexOf(reco);
            if (idx < 0) idx = 3;
            var caretLeft = ((idx + 0.5) / RECO_ORDER.length * 100).toFixed(2);
            var html = '<div class="verdict-spectrum" aria-label="Hire-recommendation scale">';
            html += '<div class="spectrum-wrap"><span class="spectrum-caret" style="--target-left:' + caretLeft + '%"></span><div class="spectrum-track">';
            for (var i = 0; i < RECO_ORDER.length; i++) {
                html += '<span class="spectrum-seg seg-' + RECO_TONE[RECO_ORDER[i]] + '" title="' + RECO_LABEL[RECO_ORDER[i]] + '"></span>';
            }
            html += '</div></div>';
            html += '<div class="spectrum-ends"><span>Strong No-Hire</span><span>you are here</span><span>Strong Hire</span></div>';
            html += '</div>';
            return html;
        }

        // Flutter across the outcomes, LAND on the real one, then write the lines in.
        function animateHero(v, fromCache) {
            var idx = RECO_ORDER.indexOf((v.overall || {}).recommendation);
            if (idx < 0) idx = 3;
            var finalLeft = ((idx + 0.5) / RECO_ORDER.length * 100) + '%';
            var caret = elements.heroSlot.querySelector('.spectrum-caret');
            var segs = elements.heroSlot.querySelectorAll('.spectrum-seg');
            var lines = elements.heroSlot.querySelectorAll('.vh-stagger');
            var btn = document.getElementById('fullReportBtn');
            if (btn) btn.addEventListener('click', function() {
                document.getElementById('signalsSlot').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            function land() {
                if (caret) caret.style.left = finalLeft;
                segs.forEach(function(s, i) { s.classList.remove('flick'); s.classList.toggle('is-current', i === idx); });
                lines.forEach(function(el, k) { setTimeout(function() { el.classList.add('in'); }, 120 + k * 110); });
            }
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!caret) { lines.forEach(function(el) { el.classList.add('in'); }); return; }
            caret.classList.add('show');
            if (reduce || fromCache) { land(); return; }
            var seq = [6, 0, 5, 1, 4, 2, idx];   // sweep, then settle
            var step = 0;
            var iv = setInterval(function() {
                var p = seq[step];
                caret.style.left = ((p + 0.5) / RECO_ORDER.length * 100) + '%';
                segs.forEach(function(s, i) { s.classList.toggle('flick', i === p); });
                if (++step >= seq.length) { clearInterval(iv); land(); }
            }, 90);
        }

        // A radar of this session's signals (you vs the solid bar) — visual scoring.
        function renderSessionRadar(v) {
            var slot = document.getElementById('sessionRadarSlot');
            if (!slot || !window.MockFlowRadar) return;
            var BAND_SCORE = { poor: 1, borderline: 2, solid: 3, outstanding: 4 };
            var axes = (v.signals || [])
                .filter(function(s) { return BAND_SCORE[s.band]; })
                .map(function(s) { return { key: s.name, label: shortSignal(s.name), you_score: BAND_SCORE[s.band], target_score: 3 }; });
            if (axes.length < 3) { slot.style.display = 'none'; return; }
            slot.innerHTML = '<div class="srad-title">Your shape this session</div>' +
                window.MockFlowRadar.build({ axes: axes, size: 300 }) +
                '<div class="radar-legend"><span class="rl rl-you">You</span><span class="rl rl-target">the bar (solid)</span></div>';
        }
        function shortSignal(name) {
            var map = {
                'Communication & structure': 'Communication', 'ML depth & evaluation rigor': 'ML depth',
                'Statistics & decision logic': 'Statistics', 'SQL & data fluency': 'SQL',
                'Analytical / execution': 'Analytical', 'Motivation & authenticity': 'Motivation',
                'Role / company fit': 'Role fit', 'Testing & verification': 'Testing',
                'Impact & metrics': 'Impact', 'Trade-off reasoning': 'Trade-offs',
                'Stakeholder communication': 'Stakeholder', 'Response to hints': 'Coachability'
            };
            return map[name] || name;
        }

        // A 4-step band meter (poor → outstanding) — visual, not just a word.
        function bandMeter(band) {
            var order = ['poor', 'borderline', 'solid', 'outstanding'];
            var idx = order.indexOf(band);
            var html = '<div class="band-meter" aria-hidden="true">';
            for (var i = 0; i < 4; i++) {
                html += '<span class="bm-step bm-' + order[i] + ((idx >= 0 && i <= idx) ? ' on' : '') + (i === idx ? ' cur' : '') + '"></span>';
            }
            return html + '</div>';
        }

        // A horizontal gauge with research-band zones + a marker at your value.
        function gauge(label, valueLabel, value, min, max, zones, band, note) {
            var pct = Math.max(2, Math.min(98, (value - min) / (max - min) * 100));
            var zoneHtml = zones.map(function(z) {
                var l = (z[0] - min) / (max - min) * 100, w = (z[1] - z[0]) / (max - min) * 100;
                return '<span class="gz gz-' + z[2] + '" style="left:' + l + '%;width:' + w + '%"></span>';
            }).join('');
            return '<div class="gauge gauge-' + (band || '') + '">' +
                '<div class="gauge-head"><span class="gauge-name">' + label + '</span><span class="gauge-val">' + valueLabel + '</span></div>' +
                '<div class="gauge-track">' + zoneHtml + '<span class="gauge-marker" style="left:' + pct + '%"></span></div>' +
                (note ? '<p class="gauge-note">' + note + '</p>' : '') + '</div>';
        }

        // Moment 3 — your next rep (the single action that drives return).
        function renderNextRep(v) {
            if (!v.gap_to_next || !v.gap_to_next.signal) return '';
            var g = v.gap_to_next, ctx = v.context || {};
            var qs = ctx.track ? ('?track=' + encodeURIComponent(ctx.track)) : '';
            return '<div class="next-rep">' +
                '<div class="next-rep-label">Your next rep</div>' +
                '<p class="next-rep-body"><strong>' + escapeHtml(g.signal) + '</strong> — ' + escapeHtml(g.move || '') + '</p>' +
                '<a class="next-rep-cta" href="/start' + qs + '">Practice this again →</a>' +
                '</div>';
        }

        // Moment 2 — signals, in your own words (revealed progressively on scroll).
        function renderSignals(v) {
            var sigs = v.signals || [];
            var html = '<div class="signals-reveal-title">The call, signal by signal — backed by your own words</div>';
            sigs.forEach(function(s, i) {
                var band = s.band || 'cannot_determine';
                var star = band === 'outstanding' ? '<span class="signal-star" title="A great answer">★</span>' : '';
                html += '<div class="signal-card sig-reveal signal-' + band + '" style="--i:' + i + '">';
                html += '<div class="signal-head"><span class="signal-name">' + escapeHtml(s.name || '') + star + '</span>';
                html += '<span class="signal-band-wrap"><span class="signal-band band-' + band + '">' + (BAND_LABEL[band] || band) + '</span>';
                html += '<button type="button" class="signal-info-btn" aria-label="What does this band mean?" ' +
                        'onclick="this.closest(\'.signal-card\').classList.toggle(\'info-open\')">i</button></span></div>';
                html += bandMeter(band);
                html += '<p class="signal-info-text">' + (BAND_INFO[band] || '') + '</p>';
                if (s.reasoning) html += '<p class="signal-reason">' + escapeHtml(s.reasoning) + '</p>';
                if (band === 'cannot_determine') {
                    html += '<p class="signal-na">Not enough in the transcript to judge this fairly.</p>';
                } else if (s.evidence && s.evidence.length) {
                    s.evidence.forEach(function(q) { html += '<blockquote class="signal-evidence">“' + escapeHtml(q) + '”</blockquote>'; });
                }
                if (s.to_raise && band !== 'outstanding' && band !== 'cannot_determine') {
                    html += '<p class="signal-raise"><span>To raise this</span> ' + escapeHtml(s.to_raise) + '</p>';
                }
                html += '</div>';
            });
            if (v.differentiators && v.differentiators.length) {
                html += '<div class="differentiators sig-reveal" style="--i:' + sigs.length + '"><div class="diff-title">What would make you a strong hire</div><ul>';
                v.differentiators.forEach(function(d) { html += '<li>' + escapeHtml(d) + '</li>'; });
                html += '</ul></div>';
            }
            return html;
        }

        // Moment 4 — the evidence behind the call (folded in last, never buries the verdict).
        function renderTrajectory(v) {
            var html = '<div class="tf-divider">The evidence behind the call</div>';
            html += '<div id="sessionRadarSlot" class="session-radar"></div>';
            html += '<div id="vsLastSlot"></div>';
            var ga = v.great_answers || 0;
            if (ga) html += '<div class="ga-line"><span class="signal-star">★</span> <strong>' + ga + '</strong> great answer' + (ga > 1 ? 's' : '') + ' in this interview</div>';
            html += renderDeliveryPanel(v.delivery);
            html += renderCodingBlock(feedbackState.codingSubmissions);
            return html;
        }

        function renderDeliveryPanel(d) {
            if (!d) return '';
            var html = '<div class="delivery-panel">';
            html += '<div class="delivery-title">Delivery <span class="delivery-sub">measured from your speech</span></div>';

            // Pace gauge — research bands: ideal 130–160, brisk to 190, flag >190.
            var wpm = d.wpm || 0;
            html += gauge('Speaking pace', wpm + ' wpm', wpm, 80, 220,
                [[110, 130, 'ok'], [130, 160, 'good'], [160, 190, 'warn'], [190, 220, 'bad']],
                d.wpm_band, DELIVERY_TIPS.wpm[d.wpm_band] || '');

            // Filler gauge — ≤5/min good, ~12/min measurably hurts.
            var fpm = d.filler_per_min || 0;
            html += gauge('Filler words', fpm + '/min', fpm, 0, 15,
                [[0, 5, 'good'], [5, 12, 'warn'], [12, 15, 'bad']],
                d.filler_band, (d.filler_total || 0) + ' total · ' + (DELIVERY_TIPS.filler[d.filler_band] || ''));

            // Personality extras (Wing D): countable, personal, deterministic.
            var chips = '';
            if (d.word_count) chips += '<span class="delivery-chip"><strong>' + d.word_count + '</strong> words spoken</span>';
            if (d.sentence_count) chips += '<span class="delivery-chip"><strong>' + d.sentence_count + '</strong> sentences</span>';
            if (d.top_crutch_word && d.top_crutch_word.word) chips += '<span class="delivery-chip">your crutch word: <strong>“' + escapeHtml(d.top_crutch_word.word) + '” ×' + d.top_crutch_word.count + '</strong></span>';
            if (typeof d.talk_ratio === 'number' && d.talk_ratio > 0) chips += '<span class="delivery-chip">you held <strong>' + Math.round(d.talk_ratio * 100) + '%</strong> of the talk time</span>';
            if (d.longest_monologue_s) chips += '<span class="delivery-chip">longest answer <strong>~' + Math.round(d.longest_monologue_s) + 's</strong></span>';
            if (chips) html += '<div class="delivery-stats">' + chips + '</div>';

            html += '</div>';  // .delivery-panel
            return html;
        }

        function renderCodingBlock(submissions) {
            if (!submissions || !submissions.length) return '';
            var html = '<div class="coding-block">';
            html += '<div class="delivery-title">Coding <span class="delivery-sub">' + submissions.length + ' submission' + (submissions.length > 1 ? 's' : '') + '</span></div>';
            submissions.forEach(function(sub) {
                var ev = sub.evaluation_result || {};
                var passed = ev.passed === true || ev.all_passed === true;
                var grade = ev.approach_grade || ev.grade || null;
                html += '<div class="coding-card">';
                html += '<div class="coding-card-head">';
                html += '<span class="coding-prob">' + escapeHtml(sub.problem_title || 'Problem') + '</span>';
                if (ev.passed !== undefined || ev.all_passed !== undefined) {
                    html += '<span class="coding-verdict ' + (passed ? 'pass' : 'fail') + '">' + (passed ? 'Tests passed' : 'Tests failed') + '</span>';
                }
                html += '</div>';
                html += '<div class="coding-meta">';
                if (sub.language) html += '<span class="coding-pill">' + escapeHtml(sub.language) + '</span>';
                if (grade) html += '<span class="coding-pill">Approach ' + escapeHtml(String(grade)) + '</span>';
                if (ev.time_complexity) html += '<span class="coding-pill">' + escapeHtml(ev.time_complexity) + '</span>';
                if (sub.time_spent_seconds) html += '<span class="coding-pill">' + Math.round(sub.time_spent_seconds / 60) + ' min</span>';
                html += '</div>';
                if (ev.feedback || ev.summary) html += '<p class="coding-note">' + escapeHtml(ev.feedback || ev.summary) + '</p>';
                if (ev.edge_cases_missed && ev.edge_cases_missed.length) {
                    html += '<p class="coding-note coding-miss"><strong>Edge cases missed:</strong> ' + escapeHtml(ev.edge_cases_missed.join(', ')) + '</p>';
                }
                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        // "vs your last session" strip — from the user's recommendation trajectory.
        function loadVsLast() {
            fetch('/api/user/insights')
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(d) {
                    if (!d || !d.reco_series || d.reco_series.length < 2) return;
                    var s = d.reco_series, prev = s[s.length - 2], curr = s[s.length - 1];
                    if (prev.index == null || curr.index == null) return;
                    var dir = curr.index > prev.index ? 'up' : (curr.index < prev.index ? 'down' : 'flat');
                    var arrow = dir === 'up' ? '▲' : (dir === 'down' ? '▼' : '→');
                    var slot = document.getElementById('vsLastSlot');
                    if (!slot) return;
                    slot.innerHTML = '<div class="vs-last vs-' + dir + '">' +
                        '<span class="vs-label">vs your last session</span>' +
                        '<span class="vs-body">' + arrow + ' ' + escapeHtml(RECO_LABEL[prev.recommendation] || '') +
                        ' → <strong>' + escapeHtml(RECO_LABEL[curr.recommendation] || '') + '</strong></span>' +
                        '<a class="vs-link" href="/dashboard">See your trajectory →</a></div>';
                })
                .catch(function() {});
        }

        // Progressive reveal of the signal cards (calm, reduced-motion-safe).
        function setupProgressiveReveal() {
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var items = document.querySelectorAll('.sig-reveal');
            if (reduce || !('IntersectionObserver' in window)) {
                items.forEach(function(el) { el.classList.add('is-in'); });
                return;
            }
            var io = new IntersectionObserver(function(entries) {
                entries.forEach(function(e) {
                    if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
                });
            }, { threshold: 0.12 });
            items.forEach(function(el) { io.observe(el); });
        }

        function showRevealError(message) {
            elements.feedbackLoading.style.display = 'none';
            elements.revealMoments.style.display = 'block';
            elements.heroSlot.innerHTML =
                '<div class="feedback-error">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' +
                    '<p>' + escapeHtml(message) + '</p>' +
                    '<button class="btn-retry" onclick="location.reload()">Retry</button>' +
                '</div>';
        }

        // ── Markdown export ──
        function buildMarkdown() {
            var meta = feedbackState.meta || {};
            var v = feedbackState.verdict || {};
            var o = v.overall || {};
            var lines = [];

            lines.push('# Interview Verdict');
            lines.push('');
            lines.push('- **Candidate:** ' + (meta.candidate || 'Unknown'));
            if (meta.job_role) lines.push('- **Role:** ' + meta.job_role);
            if (meta.experience_level) lines.push('- **Level:** ' + meta.experience_level);
            lines.push('- **Date:** ' + formatDate(meta.interview_date));
            lines.push('');

            if (o.recommendation) {
                lines.push('## Verdict: ' + (RECO_LABEL[o.recommendation] || o.recommendation));
                if (o.level_read) lines.push('Performing at **' + (LEVEL_LABEL[o.level_read] || o.level_read) + '** level' +
                                             (o.confidence ? ' (' + o.confidence + ' confidence)' : '') + '.');
                if (o.headline) { lines.push(''); lines.push('> ' + o.headline); }
                lines.push('');
            }

            if (v.gap_to_next) {
                lines.push('**Your next rep — ' + (v.gap_to_next.signal || '') + ':** ' + (v.gap_to_next.move || ''));
                lines.push('');
            }

            if (v.signals && v.signals.length) {
                lines.push('## Signals');
                lines.push('');
                v.signals.forEach(function(s) {
                    lines.push('### ' + s.name + ' — ' + (BAND_LABEL[s.band] || s.band));
                    if (s.reasoning) lines.push(s.reasoning);
                    (s.evidence || []).forEach(function(q) { lines.push('> "' + q + '"'); });
                    if (s.to_raise) lines.push('*To raise this:* ' + s.to_raise);
                    lines.push('');
                });
            }

            if (v.differentiators && v.differentiators.length) {
                lines.push('## What would make you a strong hire');
                lines.push('');
                v.differentiators.forEach(function(d) { lines.push('- ' + d); });
                lines.push('');
            }

            if (v.delivery) {
                lines.push('## Delivery');
                lines.push('- Pace: ' + v.delivery.wpm + ' wpm (target ' + v.delivery.wpm_target + ')');
                lines.push('- Filler words: ' + v.delivery.filler_per_min + '/min (target ' + v.delivery.filler_target + ')');
                if (v.delivery.sentence_count) lines.push('- Sentences spoken: ' + v.delivery.sentence_count);
                if (v.delivery.top_crutch_word && v.delivery.top_crutch_word.word) lines.push('- Crutch word: "' + v.delivery.top_crutch_word.word + '" x' + v.delivery.top_crutch_word.count);
                lines.push('');
            }

            return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
        }

        function copyFeedbackAsMarkdown() {
            var markdown = buildMarkdown();
            function onSuccess() { showCopyConfirm('Copied!'); }
            function onFailure() { showCopyConfirm('Copy failed'); }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(markdown).then(onSuccess).catch(function() {
                    fallbackCopy(markdown) ? onSuccess() : onFailure();
                });
            } else {
                fallbackCopy(markdown) ? onSuccess() : onFailure();
            }
        }

        function fallbackCopy(text) {
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'absolute';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                var ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        function showCopyConfirm(message) {
            elements.copyConfirm.textContent = message;
            elements.copyConfirm.classList.add('visible');
            if (showCopyConfirm._timer) clearTimeout(showCopyConfirm._timer);
            showCopyConfirm._timer = setTimeout(function() {
                elements.copyConfirm.classList.remove('visible');
                elements.copyConfirm.textContent = '';
            }, 2200);
        }

        function openTranscriptModal() {
            elements.transcriptModal.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeTranscriptModal() {
            elements.transcriptModal.classList.remove('visible');
            document.body.style.overflow = '';
        }

        // escapeHtml, formatDate, and formatStage are provided globally by static/utils.js.
    })();
    </script>
</body>
</html>
