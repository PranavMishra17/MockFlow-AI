name: Keep Neon warm

# Neon's free tier scales its compute to zero after inactivity, which adds a few
# seconds to the first query, and a project left completely idle for long enough
# can be suspended. A no-op query on a schedule resets that inactivity timer.
#
# The web service itself no longer needs waking: fly.toml pins
# min_machines_running = 1 with auto_stop_machines = false, so the app is always
# resident. The health ping below is kept only as a cheap liveness canary.
on:
  schedule:
    - cron: '0 12 1,15 * *'
  workflow_dispatch: {}

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (liveness canary — also warms the DB transitively)
        if: ${{ vars.APP_URL != '' }}
        run: |
          curl --max-time 180 --retry 3 --retry-delay 30 -fsS "${{ vars.APP_URL }}/health" || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Direct Neon ping
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pip install --quiet "psycopg[binary]>=3.2,<4"
          python -c "
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as conn, conn.cursor() as cur:
              cur.execute('SELECT 1')
              print('Neon ping OK ->', cur.fetchone())
          "
