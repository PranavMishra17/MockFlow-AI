name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # The suite is hermetic: conftest stubs the DB connection pool, so no
        # live database is required. (A Postgres service container for real
        # db-integration tests is the next step — see the testing plan.)
        run: pytest -q --cov=. --cov-report=term-missing

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      # Never let two deploys race for the single always-on machine.
      group: fly-deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Guarded so this workflow stays green before the token exists. Add the
      # secret with:  fly tokens create deploy -x 999999h
      # then store it as the FLY_API_TOKEN repo secret.
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set - skipping deploy. See docs/DEPLOYMENT.md section 4."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.creds.outputs.ready == 'true'

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Post-deploy health smoke
        if: steps.creds.outputs.ready == 'true' && vars.APP_URL != ''
        # /health pings Neon, so a 200 here proves app + database, not just that
        # the port is open. Retries because the machine may still be starting.
        run: |
          url="${{ vars.APP_URL }}/health"
          echo "Polling $url ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$url" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Healthy:"; cat /tmp/health.json; exit 0
            fi
            sleep 15
          done
          echo "::error::/health did not return 200 after deploy."
          exit 1
