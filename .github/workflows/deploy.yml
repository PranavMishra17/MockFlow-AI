name: CI

# Lint + tests on every push and PR.
#
# There is deliberately NO deploy job. The app runs on a Google Cloud e2-micro
# (docs/DEPLOYMENT_GCP.md) which pulls the repo itself, so a push does not deploy.
# A job named "deploy" that cannot deploy is worse than none — the previous one
# skipped silently on every run because FLY_API_TOKEN was never set, which read as
# a green deploy for weeks while nothing had ever shipped.
#
# To release, on the VM:
#   cd ~/MockFlow-AI && git pull && cd deploy/gcp && docker compose up -d --build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # The suite is hermetic: conftest stubs the DB connection pool, so no
        # live database is required.
        run: pytest -q --cov=. --cov-report=term-missing

  live-canary:
    name: Live site canary
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check the deployed site is still up
        # This does NOT verify this commit shipped — deployment is manual. It only
        # reports whether the live host is currently serving, and /health pings
        # Neon so it covers the database too. Informational: a failure here means
        # the running site is unhealthy, not that this commit is bad.
        continue-on-error: true
        run: |
          url="${{ vars.APP_URL }}"
          if [ -z "$url" ]; then
            echo "::notice::APP_URL variable not set; skipping canary."
            exit 0
          fi
          echo "Checking $url/health ..."
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$url/health" || echo 000)
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::warning::Live site returned HTTP $code — the deployed app may be down."
          fi
