name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        # The suite is hermetic: conftest stubs the DB connection pool, so no
        # live database is required. (A Postgres service container for real
        # db-integration tests is the next step — see the testing plan.)
        run: pytest -q --cov=. --cov-report=term-missing

  deploy:
    name: Deploy gate (Render auto-deploys via webhook)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Announce
        run: |
          echo "Lint + tests passed. Render auto-deploys this commit via its GitHub integration."
          echo ""
          echo "Render env vars required (set in the Render dashboard):"
          echo "   - DATABASE_URL          (Neon pooled connection string)"
          echo "   - GOOGLE_CLIENT_ID      (Google Cloud OAuth client)"
          echo "   - GOOGLE_CLIENT_SECRET"
          echo "   - SECRET_KEY            (python -c \"import secrets; print(secrets.token_hex(32))\")"
          echo "   - ENCRYPTION_KEY        (Fernet key — keep stable)"
          echo "   - FLASK_ENV=production  (enables Secure cookies + fail-fast config)"
          echo "   - CORS_ORIGINS=https://<your-domain>"
          echo ""
          echo "BYOK note: LiveKit / OpenAI / Deepgram keys are NOT env vars —"
          echo "users provide their own via the in-app Settings page."

      - name: Post-deploy health smoke
        if: ${{ vars.RENDER_URL != '' }}
        # Best-effort: poll /health until it reports healthy. Render builds take
        # a few minutes, so we retry with backoff rather than hard-failing on the
        # first miss. A persistently unhealthy endpoint surfaces in the logs.
        run: |
          url="${{ vars.RENDER_URL }}/health"
          echo "Polling $url ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$url" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Healthy:"; cat /tmp/health.json; exit 0
            fi
            sleep 20
          done
          echo "::warning::/health did not return 200 within the smoke window; check the Render deploy."
